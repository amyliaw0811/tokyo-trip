<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京 2026 行程與記帳</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #4da6ff;
      --text: #ffffff;
      --subtext: #a0a0a0;
      --ghost: #666666;
      --red: #ff5252;
      --border: #2c2c2c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 70px;
    }

    /* 頂部導覽列與面板控制 */
    nav.bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      border-top: 1px solid var(--border);
      z-index: 1000;
    }

    nav.bottom button {
      flex: 1;
      background: none;
      border: none;
      color: var(--subtext);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    nav.bottom button.active {
      color: var(--accent);
      border-top: 2px solid var(--accent);
    }

    .panel {
      display: none;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .panel.active {
      display: block;
    }

    /* 記帳頁面樣式 */
    .summary-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-around;
      border: 1px solid var(--border);
    }

    .summary-item {
      text-align: center;
    }

    .summary-item .title {
      font-size: 12px;
      color: var(--subtext);
      margin-bottom: 4px;
    }

    .summary-item .value {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent);
    }

    .input-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--subtext);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #2a2a2a;
      color: var(--text);
      font-size: 15px;
    }

    .radio-group {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 6px 0;
    }

    .radio-group label {
      margin-bottom: 0;
      cursor: pointer;
      color: var(--text);
    }

    .btn-add {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #000;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-add:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .expense-item {
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
    }

    .expense-info {
      display: flex;
      flex-direction: column;
    }

    .expense-memo {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .expense-person {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
    }

    .expense-person.a {
      background: rgba(77, 166, 255, 0.2);
      color: var(--accent);
    }

    .expense-person.b {
      background: rgba(255, 179, 0, 0.2);
      color: #ffb300;
    }

    .expense-amt {
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 行程面板 -->
  <div id="itineraryPanel" class="panel active">
    <h2 style="margin-bottom: 16px;">東京 2026 行程規劃</h2>
    <p style="color: var(--subtext);">行程內容預設顯示區塊...</p>
  </div>

  <!-- 記帳面板 -->
  <div id="expensePanel" class="panel">
    <h2 style="margin-bottom: 16px;">旅遊公帳記帳</h2>
    
    <div class="summary-card">
      <div class="summary-item">
        <div class="title">我 (A) 支付總額</div>
        <div class="value" id="sumA">¥0</div>
      </div>
      <div class="summary-item">
        <div class="title">旅伴 (B) 支付總額</div>
        <div class="value" id="sumB" style="color: #ffb300;">¥0</div>
      </div>
    </div>

    <div class="input-card">
      <div class="form-group">
        <label>消費金額 (日幣 JPY)</label>
        <input type="number" id="expAmount" class="form-control" placeholder="例：1500" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>消費項目 / 備註</label>
        <input type="text" id="expMemo" class="form-control" placeholder="例：一蘭拉麵">
      </div>
      <div class="form-group">
        <label>付款人</label>
        <div class="radio-group">
          <label><input type="radio" name="person" id="personA" checked> 我 (A)</label>
          <label><input type="radio" name="person" id="personB"> 旅伴 (B)</label>
        </div>
      </div>
      <button id="btnAddExpense" class="btn-add">新增花費</button>
    </div>

    <h3 style="margin-bottom: 12px; font-size: 16px;">消費明細</h3>
    <div id="expenseList" class="expense-list">
      <div style="text-align:center; color:var(--ghost); font-size:13px; padding:20px 0;">載入資料中...</div>
    </div>
  </div>

  <!-- 底部選單 -->
  <nav class="bottom">
    <button class="nav-btn active" data-panel="itineraryPanel">行程</button>
    <button class="nav-btn" data-panel="expensePanel">記帳</button>
  </nav>

  <script>
    /* ================= 頁面切換控制 ================= */
    const navBtns = document.querySelectorAll('nav.bottom button');
    const panels = document.querySelectorAll('.panel');

    navBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        navBtns.forEach(b => b.classList.remove('active'));
        panels.forEach(p => p.classList.remove('active'));

        btn.classList.add('active');
        const targetId = btn.getAttribute('data-panel');
        document.getElementById(targetId).classList.add('active');

        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    /* ================= EXPENSE TRACKER (Google Sheets 同步版) ================= */
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRHznEy8JbPAV-JS0F7dijg8ZjveVYVgR9WVlVCUAfSMwMhPBtOR-NaBK1yqhRdSMQqQ/exec";

    let expenses = [];

    // 從 Google Sheets 抓取最新紀錄
    async function fetchExpenses() {
      const listEl = document.getElementById('expenseList');
      if (!listEl) return;
      
      listEl.innerHTML = '<div style="text-align:center; color:var(--ghost); font-size:13px; padding:20px 0;">載入資料中...</div>';
      
      try {
        const res = await fetch(GAS_WEB_APP_URL);
        const data = await res.json();
        expenses = data.reverse(); // 最新紀錄排前面
        renderExpenses();
      } catch (err) {
        console.error(err);
        listEl.innerHTML = '<div style="text-align:center; color:var(--red); font-size:13px; padding:20px 0;">資料載入失敗，請確認網路或 App 權限</div>';
      }
    }

    function renderExpenses() {
      const listEl = document.getElementById('expenseList');
      const sumAEl = document.getElementById('sumA');
      const sumBEl = document.getElementById('sumB');
      
      let sumA = 0, sumB = 0;
      let html = '';

      expenses.forEach((ex) => {
        const amt = Number(ex.amount) || 0;
        if (ex.person === 'A') sumA += amt;
        else sumB += amt;

        const personLabel = ex.person === 'A' ? '我 (A)' : '旅伴 (B)';
        const personClass = ex.person === 'A' ? 'a' : 'b';
        
        html += `
          <div class="expense-item">
            <div class="expense-info">
              <span class="expense-memo">${ex.memo}</span>
              <span class="expense-person ${personClass}">${personLabel}</span>
            </div>
            <div style="display:flex; align-items:center;">
              <span class="expense-amt">¥${amt.toLocaleString()}</span>
            </div>
          </div>
        `;
      });

      if (expenses.length === 0) {
        html = '<div style="text-align:center; color:var(--ghost); font-size:13px; padding:20px 0;">目前還沒有記帳紀錄</div>';
      }

      listEl.innerHTML = html;
      if (sumAEl) sumAEl.textContent = '¥' + sumA.toLocaleString();
      if (sumBEl) sumBEl.textContent = '¥' + sumB.toLocaleString();
    }

    async function addExpense() {
      const amtInput = document.getElementById('expAmount');
      const memoInput = document.getElementById('expMemo');
      const personA = document.getElementById('personA');
      const btn = document.getElementById('btnAddExpense');

      const amount = parseInt(amtInput.value, 10);
      const memo = memoInput.value.trim();

      if (isNaN(amount) || amount <= 0 || !memo) {
        alert('請輸入有效的金額與備註！');
        return;
      }

      btn.disabled = true;
      btn.textContent = '上傳同步中...';

      const payload = {
        person: personA && personA.checked ? 'A' : 'B',
        amount: amount,
        memo: memo
      };

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        
        amtInput.value = '';
        memoInput.value = '';
        
        // 新增成功後重新讀取最新雲端資料
        await fetchExpenses();
      } catch (err) {
        alert('新增失敗，請再試一次');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = '新增花費';
      }
    }

    // 綁定新增按鈕事件與初始化載入
    const btnAdd = document.getElementById('btnAddExpense');
    if (btnAdd) {
      btnAdd.addEventListener('click', addExpense);
    }

    // 頁面載入完畢自動讀取雲端資料
    fetchExpenses();
  </script>
</body>
</html>
