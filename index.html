<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊記帳本</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-color: #f39c12;
      --text-color: #ffffff;
      --text-secondary: #a0a0a0;
      --border-color: #2a2a32;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h2 {
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: var(--text-color);
    }

    /* 總覽卡片區域 */
    .overview {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .card {
      flex: 1;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .card-amount {
      font-size: 1.4rem;
      font-weight: bold;
    }

    /* 表單區域 */
    .form-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #121214;
      color: #fff;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: var(--accent-color);
      color: #000;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 明細紀錄區域 */
    .list-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    .item-info .memo {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .item-info .sub-info {
      font-size: 0.8rem;
      color: var(--accent-color);
    }

    .item-amount {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .loading-text {
      text-align: center;
      color: var(--text-secondary);
      padding: 20px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 花費總覽 -->
  <h2>花費總覽</h2>
  <div class="overview">
    <div class="card">
      <div class="card-title">我 (A) 總計</div>
      <div class="card-amount" id="totalA">¥0</div>
    </div>
    <div class="card">
      <div class="card-title">旅伴 (B) 總計</div>
      <div class="card-amount" id="totalB">¥0</div>
    </div>
  </div>

  <!-- 新增花費表單 -->
  <div class="form-container">
    <form id="expenseForm">
      <div class="form-group">
        <label for="person">付款人員</label>
        <select id="person" required>
          <option value="A">我 (A)</option>
          <option value="B">旅伴 (B)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="amount">金額 (¥)</label>
        <input type="number" id="amount" placeholder="例如：1000" required>
      </div>
      <div class="form-group">
        <label for="memo">備註 / 項目</label>
        <input type="text" id="memo" placeholder="例如：晚餐、車票" required>
      </div>
      <button type="submit" id="submitBtn">新增花費</button>
    </form>
  </div>

  <!-- 明細紀錄列表 -->
  <h2>明細紀錄</h2>
  <div class="list-container" id="expenseList">
    <div class="loading-text">資料同步載入中...</div>
  </div>
</div>

<script>
  // Google Apps Script 網頁應用程式網址
  const scriptUrl = 'https://script.google.com/macros/s/AKfycbyyD4-7_lMVZTETm9CT_XVfDXARLkHPf2N1Slbs18bsJKinQDEVq7IcMECnfynhkJ1Xkw/exec';

  const expenseForm = document.getElementById('expenseForm');
  const submitBtn = document.getElementById('submitBtn');
  const expenseList = document.getElementById('expenseList');
  const totalAEl = document.getElementById('totalA');
  const totalBEl = document.getElementById('totalB');

  // 頁面載入完成後自動抓取雲端最新資料
  window.addEventListener('DOMContentLoaded', loadCloudData);

  // 1. 從 Google 試算表載入資料
  function loadCloudData() {
    expenseList.innerHTML = '<div class="loading-text">資料同步載入中...</div>';

    fetch(scriptUrl)
      .then(response => response.json())
      .then(data => {
        renderExpenses(data);
      })
      .catch(err => {
        console.error("同步失敗：", err);
        expenseList.innerHTML = '<div class="loading-text" style="color: #e74c3c;">資料載入失敗，請檢查網路連線</div>';
      });
  }

  // 2. 渲染資料與計算總金額
  function renderExpenses(data) {
    expenseList.innerHTML = '';
    let totalA = 0;
    let totalB = 0;

    if (!data || data.length === 0) {
      expenseList.innerHTML = '<div class="loading-text">目前尚無記帳紀錄</div>';
      totalAEl.textContent = '¥0';
      totalBEl.textContent = '¥0';
      return;
    }

    // 由新到舊排序顯示
    data.reverse().forEach(item => {
      const amt = Number(item.amount) || 0;
      
      if (item.person === 'A') {
        totalA += amt;
      } else if (item.person === 'B') {
        totalB += amt;
      }

      // 建立列表卡片
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `
        <div class="item-info">
          <div class="memo">${escapeHtml(item.memo || '無備註')}</div>
          <div class="sub-info">${item.person === 'A' ? '我 (A)' : '旅伴 (B)'}</div>
        </div>
        <div class="item-amount">¥${amt.toLocaleString()}</div>
      `;
      expenseList.appendChild(card);
    });

    // 更新金額總計
    totalAEl.textContent = `¥${totalA.toLocaleString()}`;
    totalBEl.textContent = `¥${totalB.toLocaleString()}`;
  }

  // 3. 送出表單資料至 Google 試算表
  expenseForm.addEventListener('submit', function(e) {
    e.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = '上傳中...';

    const payload = {
      person: document.getElementById('person').value,
      amount: document.getElementById('amount').value,
      memo: document.getElementById('memo').value,
      date: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' })
    };

    fetch(scriptUrl, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.text())
    .then(result => {
      // 清空輸入框
      document.getElementById('amount').value = '';
      document.getElementById('memo').value = '';
      
      // 重新加載最新雲端資料
      loadCloudData();
    })
    .catch(err => {
      alert('新增失敗：' + err);
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '新增花費';
    });
  });

  // 工具：防止 XSS 攻擊
  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
</script>

</body>
</html>
